<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
        <link rel="stylesheet" href="billboard.css">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <title>Your Face on a Billboard!</title>
    </head>

    <body>
        <div class="container">
            <div id="myCarousel" class="carousel slide" data-ride="carousel" data-interval="3000">
                <!-- Indicators -->
                <ol class="carousel-indicators">
                    <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
                    <li data-target="#myCarousel" data-slide-to="1"></li>
                    <li data-target="#myCarousel" data-slide-to="2"></li>
                </ol>

                <div id="wrapper">
                    <div class="carousel-inner">
                        <div class="item active">
                            <img src="media/1.jpg" alt="pic 1" style="width:100%; height:180px;">
                        </div>

                        <div class="item">
                            <img src="media/2.jpg" alt="pic 2"  style="width:100%; height:180px;">
                        </div>
                        
                        <div class="item">
                            <img src="media/3.jpg" alt="pic 3"  style="width:100%; height:180px;">
                        </div>

                        <div class="item">
                            <img src="media/4.jpg" alt="pic 4"  style="width:100%; height:180px;">
                        </div>

                        <div class="item">
                            <img src="media/5.jpg" alt="pic 5"  style="width:100%; height:180px;">
                        </div>

                        <div class="item">
                            <img src="media/6.jpg" alt="pic 6"  style="width:100%; height:180px;">
                        </div>

                        <div class="item">
                            <img src="media/7.jpg" alt="pic 7"  style="width:100%; height:180px;">
                        </div>

                        <div class="item">
                            <img src="media/8.jpg" alt="pic 8"  style="width:100%; height:180px;">
                        </div>

                        <div class="item">
                            <img src="media/9.jpg" alt="pic 9"  style="width:100%; height:180px;">
                        </div>

                        <div class="item">
                            <img src="media/10.jpg" alt="pic 10"  style="width:100%; height:180px;">
                        </div>

                        <div class="item">
                            <img src="media/11.jpg" alt="pic 11"  style="width:100%; height:180px;">
                        </div>
                    </div>
                </div>   
            </div>
        </div>


    </body>

</html>
